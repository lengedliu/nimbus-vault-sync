# Usage:
#   cp .env.example .env      # set JWT_SECRET and INITIAL_ADMIN_PASSWORD (12+ characters)
#   docker compose up -d --build
#
# Dashboard:  http://localhost:3000/
# WebSocket:  ws://localhost:3000/ws
#
# Notes/users/vaults persist in ./data on the host (bind-mounted below) —
# back that folder up, it's the entire database.

services:
  nimbus:
    build: .
    container_name: nimbus-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      TOKEN_TTL: ${TOKEN_TTL:-30d}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_PRIVATE_CLOUD_BACKUP_TARGETS: ${ALLOW_PRIVATE_CLOUD_BACKUP_TARGETS:-false}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      DATA_DIR: /app/data
      # Optional — leave unset to serve plain HTTP/WS. Set both + uncomment
      # the volume line below to serve HTTPS/WSS directly from this container.
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    volumes:
      - ./data:/app/data
      # - ./certs:/app/certs:ro   # then set TLS_CERT_PATH=/app/certs/fullchain.pem etc.
