<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>Nimbus Vault Sync · Obsidian 高速实时同步服务</title>
  <meta name="description" content="High-performance Obsidian sync server with Git auto-backup, Web dashboard, full REST API, and 20 MCP tools">
  <meta property="og:title" content="Nimbus Vault Sync · Obsidian 高速实时同步服务">
  <meta property="og:description" content="High-performance Obsidian sync server with Git auto-backup, Web dashboard, full REST API, and 20 MCP tools">
  <link rel="stylesheet" href="style.css?v=1.3.1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M8.5 25C4.9 25 2 22.1 2 18.5C2 15.2 4.4 12.5 7.6 12.1C8.9 7.8 12.8 4.8 17.5 4.8C22.9 4.8 27.3 9.0 27.5 14.4C29.8 15.5 31 18.0 30.3 20.5C29.6 23.1 27.2 25 24.5 25Z' fill='%2338bdf8'/><path d='M16.5 10.5L13.5 16.5H17.5L14.5 22' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/></svg>">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nimbus_theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        var savedFontSize = localStorage.getItem('nimbus_font_size') || 'normal';
        document.documentElement.setAttribute('data-font-size', savedFontSize);
      } catch (e) {}
    })();
  </script>
</head>
<body>

<div id="login-view" class="center-screen center-box" style="position:relative;">
  <!-- Login language switcher in the corner -->
  <div class="login-lang-corner">
    <div class="fontsize-picker-wrap" id="login-fontsize-picker-container">
      <button type="button" id="login-fontsize-btn" class="lang-menu-btn fontsize-menu-btn" title="字号调节 / Font Size">
        <span class="fontsize-icon">🔤</span>
        <span id="login-fontsize-label">标准 (100%)</span>
        <span style="font-size:10px;opacity:0.7;">▼</span>
      </button>
      <div id="login-fontsize-dropdown" class="fontsize-dropdown-menu hidden">
        <div class="fontsize-dropdown-header">
          <span class="fontsize-dropdown-title" data-i18n="fontsize.dropdown_title">字号缩放比例</span>
          <button type="button" id="login-fontsize-reset-btn" class="fontsize-reset-btn" title="恢复默认标准大小" data-i18n="fontsize.reset_btn">恢复默认</button>
        </div>
        <button type="button" class="fontsize-opt-item" data-size-val="sm">
          <div class="fontsize-opt-left">
            <span class="fontsize-badge" style="font-size: 11px;">A⁻</span>
            <span data-i18n="fontsize.sm">紧凑小号 (88%)</span>
          </div>
          <span class="fontsize-check"></span>
        </button>
        <button type="button" class="fontsize-opt-item" data-size-val="normal">
          <div class="fontsize-opt-left">
            <span class="fontsize-badge" style="font-size: 13px;">A</span>
            <span data-i18n="fontsize.normal">标准适中 (100%)</span>
          </div>
          <span class="fontsize-check"></span>
        </button>
        <button type="button" class="fontsize-opt-item" data-size-val="md">
          <div class="fontsize-opt-left">
            <span class="fontsize-badge" style="font-size: 15px;">A⁺</span>
            <span data-i18n="fontsize.md">舒适中号 (112%)</span>
          </div>
          <span class="fontsize-check"></span>
        </button>
        <button type="button" class="fontsize-opt-item" data-size-val="lg">
          <div class="fontsize-opt-left">
            <span class="fontsize-badge" style="font-size: 17px;">A⁺⁺</span>
            <span data-i18n="fontsize.lg">清晰大号 (125%)</span>
          </div>
          <span class="fontsize-check"></span>
        </button>
      </div>
    </div>

    <div class="lang-picker-wrap">
      <button type="button" id="login-lang-btn" class="lang-menu-btn" title="切换语言 / Switch Language">
        <span>🌐</span>
        <span id="login-lang-label">🇨🇳 简体中文</span>
        <span style="font-size:10px;opacity:0.7;">▼</span>
      </button>
      <div id="login-lang-dropdown" class="lang-dropdown-menu hidden">
        <button type="button" class="lang-opt-item" data-lang-val="zh-CN">
          <span>🇨🇳</span>
          <span>简体中文</span>
        </button>
        <button type="button" class="lang-opt-item" data-lang-val="zh-TW">
          <span>🇭🇰</span>
          <span>繁體中文</span>
        </button>
        <button type="button" class="lang-opt-item" data-lang-val="en">
          <span>🇺🇸</span>
          <span>English</span>
        </button>
        <button type="button" class="lang-opt-item" data-lang-val="ko">
          <span>🇰🇷</span>
          <span>한국어</span>
        </button>
        <button type="button" class="lang-opt-item" data-lang-val="ja">
          <span>🇯🇵</span>
          <span>日本語</span>
        </button>
      </div>
    </div>
  </div>

  <form id="login-form" class="card login-card">
    <div class="brand">
      <span class="logo cloud-logo-wrap">
        <svg class="cloud-logo-svg" width="30" height="30" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cloud-grad-login" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
            <linearGradient id="cloud-highlight-login" x1="10" y1="4" x2="22" y2="20" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <filter id="cloud-glow-login" x="-2" y="-2" width="36" height="36" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#818cf8" flood-opacity="0.4"/>
            </filter>
          </defs>
          <path d="M 8.5 25 C 4.9 25 2 22.1 2 18.5 C 2 15.2 4.4 12.5 7.6 12.1 C 8.9 7.8 12.8 4.8 17.5 4.8 C 22.9 4.8 27.3 9.0 27.5 14.4 C 29.8 15.5 31 18.0 30.3 20.5 C 29.6 23.1 27.2 25 24.5 25 L 8.5 25 Z" fill="url(#cloud-grad-login)" filter="url(#cloud-glow-login)"/>
          <path d="M 8.5 24.5 C 5.2 24.5 2.5 21.8 2.5 18.5 C 2.5 15.5 4.7 13.0 7.7 12.6 C 9.0 8.5 12.8 5.5 17.5 5.5 C 22.5 5.5 26.5 9.3 26.8 14.3 C 29.0 15.3 30.2 17.6 29.5 19.9 C 28.9 22.2 26.8 23.8 24.5 23.8" stroke="url(#cloud-highlight-login)" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M 16.5 10.5 L 13.5 16.5 H 17.5 L 14.5 22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name" data-i18n="login.title">Nimbus Vault Sync</span>
    </div>
    <div class="subtitle" data-i18n="login.subtitle">Obsidian 高速实时同步服务 · 管理后台</div>
    <div class="login-date-display" id="login-date-display" title="当前系统日期">
      <span class="date-icon">📅</span>
      <span id="login-date-text" class="date-text"></span>
    </div>

    <label>
      <span data-i18n="login.server_label">服务器地址</span>
      <input type="text" id="login-server" data-i18n-placeholder="login.server_placeholder" placeholder="留空默认当前服务器 (自动识别端口)" />
    </label>
    <label>
      <span data-i18n="login.username_label">用户名</span>
      <input type="text" id="login-username" required autocomplete="username" />
    </label>
    <label>
      <span data-i18n="login.password_label">密码</span>
      <input type="password" id="login-password" required autocomplete="current-password" />
    </label>

    <div id="login-error" class="error-msg"></div>
    <div id="login-hint-badge-box" class="login-hint-badge" style="font-size:11.5px;color:var(--text-secondary);background:rgba(255,255,255,0.04);border:1px dashed var(--border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin:2px 0 8px 0;">
      <span>💡 默认管理员：<code id="login-default-hint" style="font-family:monospace;font-weight:600;color:var(--primary);cursor:pointer;" title="点击自动填入">admin / admin123</code></span>
      <button type="button" id="btn-quick-fill-admin" style="font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;">一键填入</button>
    </div>
    <button type="submit" class="primary" data-i18n="login.submit_btn">登录</button>
  </form>
</div>

<div id="app-view" class="app hidden">

          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>

      </button>

              <linearGradient id="cloud-grad-topbar" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse">

    <div class="who">
      <!-- Language Switcher Selector -->

        <button id="lang-menu-btn" class="lang-menu-btn" data-i18n-title="topbar.lang_title" title="切换语言 / Language">

          <span id="lang-label-name">简体中文</span>
          <span style="font-size:10px;opacity:0.7;">▼</span>
        </button>
        <div id="lang-dropdown-menu" class="lang-dropdown-menu hidden">
          <button class="lang-opt-item" data-lang-val="zh-CN">
            <span>🇨🇳</span>
            <span>简体中文</span>
          </button>
          <button class="lang-opt-item" data-lang-val="zh-TW">
            <span>🇭🇰</span>
            <span>繁體中文</span>
          </button>
          <button class="lang-opt-item" data-lang-val="en">
            <span>🇺🇸</span>
            <span>English</span>
          </button>
          <button class="lang-opt-item" data-lang-val="ko">
